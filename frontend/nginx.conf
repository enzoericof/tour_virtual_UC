server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cuerpo máximo para futuras cargas desde el visor.
  client_max_body_size 25m;

  # API REST del backend Spring Boot.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # WebSocket de presencia multijugador.
  location /ws/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # HTML sin caché: un build nuevo se ve al recargar.
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }

  # Recursos con hash de Vite: se pueden cachear para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
