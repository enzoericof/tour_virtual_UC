services:
  database:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: tour_uc
      POSTGRES_USER: tour_uc
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Definir DATABASE_PASSWORD en .env}
    volumes:
      - campus-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tour_uc -d tour_uc"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://database:5432/tour_uc
      DATABASE_USER: tour_uc
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Definir DATABASE_PASSWORD en .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
volumes:
  campus-data:
