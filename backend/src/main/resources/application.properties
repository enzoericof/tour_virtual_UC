spring.application.name=tour-virtual-uc
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tour_uc}
spring.datasource.username=${DATABASE_USER:tour_uc}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=60m
server.error.include-message=never
app.origin=${APP_ORIGIN:http://localhost:8080}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
server.address=${SERVER_ADDRESS:127.0.0.1}
